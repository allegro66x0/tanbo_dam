[project]
name = "tanbo-parent"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["digi-xbee>=1.5.0", "pyserial>=3.5", "requests>=2.28"]

[project.scripts]
tanbo-parent = "tanbo.main:main"
tanboctl = "tanbo.ctl:main"
tanbo-web = "tanbo.web:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tanbo"]

[tool.setuptools.package-data]
tanbo = ["static/*.html"]
