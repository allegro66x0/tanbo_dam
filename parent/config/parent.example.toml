# 田んぼダム 親機設定 — /etc/tanbo/parent.toml にコピーして編集
# 変更後は: sudo systemctl restart tanbo-parent

[xbee]
# /dev/ttyUSB0 はモバイル通信モジュールと番号が入れ替わることがあるので by-id で指定する
#   ls -l /dev/serial/by-id/
port = "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AQ04PSC2-if00-port0"
baud = 9600
reply_timeout_s = 3.0   # REQ 送信から応答を待つ上限(子機のバースト測定は約0.5秒)
gap_s = 0.2             # ノード間の送信間隔

[schedule]
interval_s = 600               # 通常運用: 10分。毎時 00,10,20... 分に揃う
check_interval_s = 60          # tanboctl check で使う設置チェック用の周期
check_default_duration_s = 7200   # tanboctl check の既定継続時間(2時間)。過ぎたら自動で通常周期へ
check_max_duration_s = 86400
offset_s = 0

[upload]
url = "https://script.google.com/macros/s/XXXXXXXX/exec"
token = "GAS のスクリプトプロパティ TOKEN と同じ値"
parent_id = "parent-1"
batch_max = 500
period_s = 60
timeout_s = 40

[storage]
# overlayfs でルートを読み取り専用にする場合、ここは rw の別パーティションに置く
db_path = "/var/lib/tanbo/tanbo.db"
retain_days = 365

[health]
# INA219 を付けたらコメントを外す(i2cdetect -y 1 でアドレス確認)
# ina219_bus = 1
# ina219_addr = 0x40
modem = "none"   # ModemManager 管理下のモデムなら "mmcli"

[control]
socket = "/run/tanbo/ctl.sock"

[web]
# 操作画面(tanbo-web)。スマホから Tailscale 経由で http://<親機のTailscale名>:8080/ を開く
bind = "0.0.0.0"
port = 8080
# この I/F に届いた接続だけ受け付ける。LTE・Wi-Fi・USB 通信端末の側からは開けない
allow_interfaces = ["lo", "tailscale0"]

# 親機の地点のセンサ。親機に USB でつないだ ESP32 + HC-SR04(子機と同じファーム v2.1.0 以降)
# 使うときは [local] からコメントを外す。ポートは ls -l /dev/serial/by-id/ で確認する
# [local]
# port = "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_XXXX-if00-port0"
# node = 11              # この地点のノード番号。[nodes] と重ならない番号にする
# baud = 115200
# reply_timeout_s = 3.0
#
# HC-SR04 を親機の GPIO に直接つなぐ場合(par2)。ECHO は 10k/20k で 3.3 V に分圧すること
# 物理ピン 2 = 5V、16 = GPIO23(TRIG)、18 = GPIO24(ECHO)、20 = GND。gpiod(libgpiod v2)が要る
# [local]
# type = "gpio"
# node = 10             # この地点のノード番号(par2 の XBee と同じ 10)。[nodes] と重ならない番号にする
# trig = 23             # BCM 番号
# echo = 24
# chip = "/dev/gpiochip0"

# 親機を 2 台置く場合: GAS の「分担」シートで担当のノードだけを測る。表を受け取るまでに測るノードを initial に書く
# (書かなければ [nodes] 全部)。parent_id は親機ごとに変える(p3 = parent-1、par2 = parent-2)
# [assign]
# initial = [2, 4]

[nodes]
# ノード番号 = 子機 XBee の 64bit アドレス(xbee_ID.xlsx)
# 親機用の XBee は計測対象にしない(番号の後ろから親機用に使う)。親機の地点のセンサの番号は、その親機の XBee の番号にそろえる
#   0  = "0013A200423ECC65"   旧親機(2026-10 に水没で故障)
#   10 = "0013A200423EAFE2"   par2(ルータ)。par2 の地点のセンサも node 10
#   11 = "0013A200423EB740"   p3(現地のコーディネータ)。p3 の地点のセンサも node 11
#   12 = "0013A200423EC8E7"   研究室用コーディネータ(現地に持ち込まない)
1  = "0013A200423ECBC6"
2  = "0013A200423EC0CD"
3  = "0013A200423EB483"
4  = "0013A200423E9827"
5  = "0013A200423EB80C"
6  = "0013A200423EB0A3"
7  = "0013A200423EB488"
8  = "0013A200423EC984"
9  = "0013A200423EB6B4"
